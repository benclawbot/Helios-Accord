[package]
name = "helios-accord"
version = "1.0.0"
description = "A single-system grand strategy game"
authors = ["benclawbot"]
edition = "2021"

[lib]
name = "helios_accord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
